# ==============================================================================
# Nginx Configuration for Vue 3 SPA and API Reverse Proxy
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # 1. Serve static production assets of the Vue 3 Single Page Application (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Support SPA history mode routing by falling back to index.html
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse proxy API requests to internal Flask backend container
    location /api/ {
        # Forward traffic to the 'backend' container on internal port 5000
        proxy_pass http://backend:5000/api/;
        
        # Forward original client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for streaming binary image data
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error handling for 5xx responses
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
